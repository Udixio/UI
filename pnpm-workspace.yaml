# pnpm 10 defaults this to false, which resolves the internal `@udixio/*`
# dependencies from the registry even though the workspace builds them. The
# packages depend on each other by exact version rather than `workspace:*`, and
# the `development` export condition only reaches real sources through a
# workspace link, so this has to stay on.
linkWorkspacePackages: true
ignoredBuiltDependencies:
  - 'core-js-pure'
  - 'sharp'
onlyBuiltDependencies:
  - 'nx'
packages:
  - 'packages/*'
  - 'packages/icons/*'
  - 'apps/*'

# pnpm >= 10 blocks dependency build scripts unless approved (pnpm 11 fails
# the install). These are the ones that ran under pnpm 8: native/binary
# downloads for esbuild, swc and the nx daemon stack.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  less: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - svelte@5.57.1
