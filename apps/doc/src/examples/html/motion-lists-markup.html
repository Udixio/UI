<!--
  A list of messages. Each one enters with the cascade, and when one leaves, the others close the gap.
-->
<button type="button" id="add">Add two</button>

<ul id="messages" class="mt-4 flex flex-col gap-2">
  <li data-motion="cascade reflow" class="flex items-center justify-between gap-3 rounded-2xl bg-surface-container-high py-2 pl-4 pr-2">
    <span class="text-body-large text-on-surface">Ada: your build passed</span>
    <button type="button" data-dismiss>Dismiss</button>
  </li>
  <li data-motion="cascade reflow" class="flex items-center justify-between gap-3 rounded-2xl bg-surface-container-high py-2 pl-4 pr-2">
    <span class="text-body-large text-on-surface">Lin: review requested</span>
    <button type="button" data-dismiss>Dismiss</button>
  </li>
</ul>

<template id="message">
  <li data-motion="cascade reflow" class="flex items-center justify-between gap-3 rounded-2xl bg-surface-container-high py-2 pl-4 pr-2">
    <span class="text-body-large text-on-surface"></span>
    <button type="button" data-dismiss>Dismiss</button>
  </li>
</template>

<script type="module">
  import { connectMotion } from '@udixio/motion';
  import '@udixio/motion/presets';

  // Binds data-motion on the messages of the page now, and on the messages that you insert later.
  connectMotion();

  const messages = document.getElementById('messages');
  const template = document.getElementById('message');
  const TEXTS = ['Mo: deploy finished', 'Kai: release is ready'];

  // Inserted in one task: the two cascade in, in visual order.
  document.getElementById('add').addEventListener('click', () => {
    messages.prepend(
      ...TEXTS.map((text) => {
        const item = template.content.firstElementChild.cloneNode(true);
        item.querySelector('span').textContent = text;
        return item;
      }),
    );
  });

  // Hidden makes the exit play; then the message is hidden, and the others close the gap.
  messages.addEventListener('click', (event) => {
    if (event.target.matches('[data-dismiss]')) event.target.closest('li').hidden = true;
  });
</script>
