<!--
  A sentence split into words, each of which arrives in turn. The text is read once, as written: the split is a visual copy.
-->
<div class="flex flex-col items-start gap-4">
  <p data-motion="headline" class="text-headline-medium text-on-surface">Every word arrives in turn, and is read once.</p>
  <button type="button" id="replay">Replay</button>
</div>

<script type="module">
  import { connectMotion, defineMotion, getMotion } from '@udixio/motion';

  // A reveal: the words wait in their first frame until the sentence enters the view, then play once.
  defineMotion('headline', {
    verb: 'reveal',
    split: 'words',
    reduced: 'fade',
    keyframes: [
      { opacity: 0, y: 12 },
      { opacity: 1, y: 0 },
    ],
  });
  connectMotion();

  // The binding of the reveal replays it from its first frame.
  const headline = document.querySelector('[data-motion="headline"]');
  document.getElementById('replay').addEventListener('click', () => {
    getMotion(headline, 'view')?.play();
  });
</script>
