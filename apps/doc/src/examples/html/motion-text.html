<!--
  A lyric line: each word rises and fades in, in turn. The read-once copy is hidden from the screen reader.
-->
<div class="flex flex-col items-start gap-4">
  <p id="lyric" data-motion="headline" data-motion-state="0" class="text-headline-medium text-on-surface">Every word arrives in turn, and is read once.</p>
  <button type="button" id="next" class="h-10 rounded-full px-4 text-label-large text-primary">Next line</button>
</div>

<script type="module">
  import { connectMotion, defineMotion } from '@udixio/motion';

  // Each word rises and fades in, in turn. A new data-motion-state is a new line: its words play again.
  defineMotion('headline', {
    verb: 'reveal',
    split: 'words',
    reduced: 'fade',
    keyframes: [
      { opacity: 0, y: 12 },
      { opacity: 1, y: 0 },
    ],
  });
  connectMotion();

  const LINES = [
    'Every word arrives in turn, and is read once.',
    'The light comes in slowly, one word at a time.',
    'Let the last word settle.',
  ];
  const lyric = document.getElementById('lyric');
  let line = 0;
  document.getElementById('next').addEventListener('click', () => {
    line = (line + 1) % LINES.length;
    lyric.textContent = LINES[line];
    lyric.setAttribute('data-motion-state', String(line));
  });
</script>
