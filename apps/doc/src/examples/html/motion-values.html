<!--
  A counter: a state value with a format. Its number is the value attribute, and it is also written as the text of the
  element. The runtime counts to each new number, once the counter is in view.
-->
<data
  value="12480"
  data-motion-value="visitors-count"
>12480</data>
<button type="button" id="add">Add 1,000 visitors</button>

<script type="module">
  import { connectMotion } from '@udixio/motion';
  import { defineValue } from '@udixio/motion/value';

  defineValue('visitors-count', {
    source: 'state',
    format: 'integer',
    range: [0, 100000],
  });
  connectMotion();

  const count = document.querySelector('data');
  document.getElementById('add').addEventListener('click', () => {
    const next = Number(count.getAttribute('value')) + 1000;
    count.setAttribute('value', String(next));
  });
</script>
