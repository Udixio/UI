<!--
  A notification list. Messages added together cascade in, in visual order;
  a dismissed message leaves out of the flow, and its neighbours close the gap.
-->
<button type="button" id="add-three">Add three</button>

<ul id="inbox" class="relative flex flex-col gap-2">
  <li data-motion="inbox reflow"
      data-motion-gesture="dismiss">Ada: your build passed</li>
  <li data-motion="inbox reflow"
      data-motion-gesture="dismiss">Lin: review requested</li>
</ul>

<template id="message">
  <li data-motion="inbox reflow"
      data-motion-gesture="dismiss"></li>
</template>

<script type="module">
  import { connectMotion, defineMotion } from '@udixio/motion';
  import { defineGesture } from '@udixio/motion/gesture';
  import '@udixio/motion/presets';

  // Messages that enter in the same task start one step apart, from the first.
  // A leaving message is taken out of the flow, so its neighbours close the gap.
  defineMotion('inbox', {
    verb: 'appear',
    keyframes: [
      { opacity: 0, y: -16, scale: 0.96 },
      { opacity: 1, y: 0, scale: 1 },
    ],
    stagger: 'normal',
    origin: 'first',
    exit: 'out-of-flow',
  });
  // Swipe a message away, or focus it and press Delete.
  defineGesture('dismiss', { type: 'swipe', alternative: 'action' });
  connectMotion();

  const inbox = document.getElementById('inbox');
  const model = document.getElementById('message').content.firstElementChild;
  const senders = ['Mo: deploy finished', 'Ines: new comment', 'Kai: release is ready'];
  let count = 0;

  function next() {
    const message = model.cloneNode();
    message.textContent = senders[count++ % senders.length];
    return message;
  }

  document.getElementById('add-three').addEventListener('click', () => {
    // Inserted in one task: the three cascade in.
    inbox.prepend(next(), next(), next());
  });

  // A swiped message ends out of sight, with aria-hidden="true": remove it.
  new MutationObserver(() => {
    for (const message of inbox.querySelectorAll('[aria-hidden="true"]')) message.remove();
  }).observe(inbox, { subtree: true, attributeFilter: ['aria-hidden'] });
</script>
