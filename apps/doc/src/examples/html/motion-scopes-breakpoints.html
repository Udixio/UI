<!-- Motion per breakpoint: a class names the motion an element plays, or none. -->
<section>
  <article data-motion="rise">Plain</article>
  <article data-motion="rise" class="md:motion-[fade-on-view]">Fades from md</article>
  <article data-motion="rise" class="motion-none">Off</article>
</section>

<script type="module">
  import { connectMotion, defineMotion } from '@udixio/motion';

  // Only a reveal can replace a rise: not a presence.
  defineMotion('fade-on-view', {
    verb: 'reveal',
    keyframes: [{ opacity: 0 }, { opacity: 1 }],
  });
  connectMotion();
</script>
