<!--
  A sequence: the children of one root play in named steps, with one handle for the whole choreography.
-->
<div
  id="intro"
  data-motion="intro-steps"
  class="flex flex-col items-start gap-3"
>
  <h3 data-motion-step="title">
    Steps, in order
  </h3>
  <p data-motion-step="body">
    The body starts after the title.
  </p>
</div>
<button type="button" id="replay">Replay</button>

<script type="module">
  import { connectMotion } from '@udixio/motion';
  import { defineSequence, getSequence } from '@udixio/motion/sequence';

  // The body starts a fixed step after the title, and the root names the sequence.
  defineSequence('intro-steps', {
    verb: 'appear',
    steps: {
      title: {
        keyframes: [
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0 },
        ],
      },
      body: {
        keyframes: [{ opacity: 0 }, { opacity: 1 }],
        at: '+=normal',
      },
    },
  });
  connectMotion();

  const intro = document.getElementById('intro');
  document.getElementById('replay').addEventListener('click', () => getSequence(intro)?.play());
</script>
