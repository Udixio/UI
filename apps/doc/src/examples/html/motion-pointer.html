<!--
  A card that tilts with the pointer on two axes, and a gauge that a Level range fills. The card names its two pointer
  values in data-motion-value: the runtime writes them on the card, and the CSS turns it with them.
-->
<div class="tilt">
  <div
    class="card"
    data-motion-value="tilt-x tilt-y"
  >
    <p>Move over this card</p>
  </div>
</div>

<label>Level <input id="level" type="range" min="0" max="1" step="0.01" value="0.6" /></label>
<data id="gauge" value="0.6" class="gauge"></data>

<script type="module">
  import { connectMotion } from '@udixio/motion';
  import { defineValue, value } from '@udixio/motion/value';

  // The pointer values follow the place of the pointer across the card; the state value is set by the page.
  defineValue('tilt-x', {
    source: 'pointer',
    axis: 'x',
    range: [-8, 8],
  });
  defineValue('tilt-y', {
    source: 'pointer',
    axis: 'y',
    range: [6, -6],
  });
  defineValue('level', {
    source: 'state',
    range: [0, 1],
  });
  connectMotion();

  const gauge = value(document.getElementById('gauge'), 'level');
  document.getElementById('level').addEventListener('input', (event) => {
    gauge.set(Number(event.target.value));
  });
</script>
