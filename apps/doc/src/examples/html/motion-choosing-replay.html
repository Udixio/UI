<button type="button" id="widen" data-motion="press">Widen</button>
<div id="card" data-motion="reflow" style="width: 50%">Now playing</div>

<script type="module">
  import { connectMotion } from '@udixio/motion';
  import '@udixio/motion/presets';

  connectMotion();

  const button = document.getElementById('widen');
  const card = document.getElementById('card');

  button.addEventListener('click', () => {
    const wide = card.style.width !== '100%';
    card.style.width = wide ? '100%' : '50%';
    button.textContent = wide ? 'Narrow' : 'Widen';
    // Each new state plays the first listed motion that
    // is not a presence: the press, and the layout.
    const state = wide ? 'wide' : 'narrow';
    button.dataset.motionState = state;
    card.dataset.motionState = state;
  });
</script>
