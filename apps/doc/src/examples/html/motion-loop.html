<!--
  Three bars of an equalizer, each on its own beat. The button holds all three, with data-motion-paused.
-->
<div class="flex flex-col items-start gap-6">
  <div class="flex h-16 items-end gap-2">
    <span data-motion="beat-low" class="block h-full w-3 origin-bottom rounded-full bg-primary"></span>
    <span data-motion="beat-mid" class="block h-full w-3 origin-bottom rounded-full bg-primary"></span>
    <span data-motion="beat-high" class="block h-full w-3 origin-bottom rounded-full bg-primary"></span>
  </div>
  <button type="button" id="toggle" class="h-10 rounded-full px-4 text-label-large text-primary">Pause</button>
</div>

<script type="module">
  import { connectMotion, defineMotion } from '@udixio/motion';

  // Three bars on three beats: each beat is a loop of its own.
  defineMotion('beat-low', {
    verb: 'loop',
    keyframes: [{ scaleY: 0.3 }, { scaleY: 1 }],
    timing: { duration: 'duration.medium4', easing: 'easing.standard' },
    pause: 'control',
  });
  defineMotion('beat-mid', {
    verb: 'loop',
    keyframes: [{ scaleY: 0.3 }, { scaleY: 1 }],
    timing: { duration: 'duration.long3', easing: 'easing.standard' },
    pause: 'control',
  });
  defineMotion('beat-high', {
    verb: 'loop',
    keyframes: [{ scaleY: 0.3 }, { scaleY: 1 }],
    timing: { duration: 'duration.extraLong1', easing: 'easing.standard' },
    pause: 'control',
  });
  connectMotion();

  // The button sets data-motion-paused on each bar: the loops hold, and play again when it is removed.
  const bars = document.querySelectorAll('[data-motion^="beat-"]');
  const toggle = document.getElementById('toggle');
  let paused = false;
  toggle.addEventListener('click', () => {
    paused = !paused;
    for (const bar of bars) bar.toggleAttribute('data-motion-paused', paused);
    toggle.textContent = paused ? 'Play' : 'Pause';
  });
</script>
