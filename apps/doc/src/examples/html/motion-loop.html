<div
  id="equalizer"
  class="flex flex-col items-start gap-6"
>
  <div
    class="flex h-16 items-end gap-2 *:block *:h-full
      *:w-3 *:origin-bottom *:rounded-full
      *:bg-primary"
  >
    <span data-motion="beat-low"></span>
    <span data-motion="beat-mid"></span>
    <span data-motion="beat-high"></span>
  </div>
  <button
    type="button"
    id="toggle"
    class="h-10 rounded-full px-4
      text-label-large text-primary"
  >
    Pause
  </button>
</div>

<script type="module">
  import {
    connectMotion,
    defineMotion,
  } from '@udixio/motion';

  // One definition, three beats: only the cycle
  // changes. A loop restarts from its first
  // keyframe, so the last one returns to it.
  const beat = (duration) => ({
    verb: 'loop',
    keyframes: [
      { scaleY: 0.3 },
      { scaleY: 1 },
      { scaleY: 0.3 },
    ],
    timing: { duration, easing: 'easing.standard' },
    pause: 'control',
  });
  defineMotion('beat-low', beat(800));
  defineMotion('beat-mid', beat(1100));
  defineMotion('beat-high', beat(1400));
  connectMotion();

  // The button sets data-motion-paused on each bar:
  // the loops hold, and play again once it is gone.
  const root = document.getElementById('equalizer');
  const bars = root.querySelectorAll('span');
  const toggle = document.getElementById('toggle');
  let paused = false;
  toggle.addEventListener('click', () => {
    paused = !paused;
    for (const bar of bars) {
      bar.toggleAttribute(
        'data-motion-paused',
        paused,
      );
    }
    toggle.textContent = paused ? 'Play' : 'Pause';
  });
</script>
