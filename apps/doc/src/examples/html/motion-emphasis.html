<!-- A like button that presses on each click: each new value of data-motion-state replays the press. -->
<div class="flex flex-col items-start gap-4">
  <button
    type="button"
    id="like"
    data-motion="press"
    data-motion-state="0"
    class="h-10 rounded-full bg-primary px-4 text-label-large text-on-primary"
  >
    Like
  </button>
  <p class="text-body-medium text-on-surface-variant">Likes: <span id="likes">0</span></p>
</div>

<script type="module">
  import { connectMotion } from '@udixio/motion';
  import '@udixio/motion/presets';

  connectMotion();

  const like = document.getElementById('like');
  const likes = document.getElementById('likes');
  let count = 0;

  like.addEventListener('click', () => {
    count += 1;
    // The new state replays the press.
    like.dataset.motionState = String(count);
    likes.textContent = String(count);
  });
</script>
