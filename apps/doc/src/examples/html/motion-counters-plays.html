<!--
  A counter: a state value with a format. Its number is the value attribute, and its text follows it: the runtime counts
  to each new number, once the counter is in view.
-->
<data value="12480" data-motion-value="plays" class="block text-display-small text-on-surface">12,480</data>
<button type="button" id="add" class="h-10 rounded-full px-4 text-label-large text-primary">Add 1,000 plays</button>

<script type="module">
  import { connectMotion } from '@udixio/motion';
  import { defineValue } from '@udixio/motion/value';

  defineValue('plays', {
    source: 'state',
    format: 'integer',
    range: [0, 100000],
  });
  connectMotion();

  // Setting the value attribute moves the counter: it counts up to the new number.
  const count = document.querySelector('data');
  document.getElementById('add').addEventListener('click', () => {
    count.setAttribute('value', String(Number(count.getAttribute('value')) + 1000));
  });
</script>
