<!--
  A cover that sinks under the pointer on both axes, and the bar of the track's progress, which the slider sets.
-->
<div class="flex w-full max-w-72 flex-col gap-6">
  <div
    data-motion-value="tilt"
    class="rounded-3xl bg-primary-container p-5 text-on-primary-container [transform:perspective(600px)_rotateY(var(--udx-motion-value-tilt-x-deg,0deg))_rotateX(calc(var(--udx-motion-value-tilt-y-deg,0deg)_*_-1))] motion-reduce:[transform:none]"
  >
    <p class="text-title-large">Lowlands</p>
  </div>
  <input id="progress" type="range" min="0" max="1" step="0.01" value="0.6" aria-label="Progress" class="accent-primary" />
  <div class="h-3 overflow-hidden rounded-full bg-surface-container-highest">
    <data id="bar" value="0.6" class="block h-full w-full origin-left rounded-full bg-primary [scale:var(--udx-motion-value-progress,0)_1]"></data>
  </div>
</div>

<script type="module">
  import { connectMotion } from '@udixio/motion';
  import { defineValue, value } from '@udixio/motion/value';

  // One value on both axes, in degrees; the vertical channel is negated in the CSS above.
  defineValue('tilt', { source: 'pointer', axis: 'both', range: [-8, 8], unit: 'deg' });
  // The progress of the track: the slider sets it, and the bar follows it.
  defineValue('progress', { source: 'state', range: [0, 1] });
  // Binds data-motion-value on the cover. The bar is bound below, from the script.
  connectMotion();

  const bar = value(document.getElementById('bar'), 'progress');
  document.getElementById('progress').addEventListener('input', (event) => {
    bar.set(Number(event.target.value));
  });
</script>
