<!--
  A queue of toasts. Each save adds one; past three, the oldest leaves. A toast leaves after four seconds,
  or at once on Undo, and it is removed when its exit has played: the others close the gap then.
-->
<button type="button" id="save">Save to library</button>

<!-- One live region, there from the start: each toast added to it is announced. -->
<ol id="toasts" class="relative flex flex-col gap-2" aria-live="polite" aria-label="Notifications"></ol>

<template id="toast">
  <li
    data-motion="slide reflow"
    class="flex min-h-12 items-center gap-2 rounded bg-inverse-surface py-0.5 ps-4 pe-2 text-body-medium text-inverse-on-surface"
  >
    Saved to your library
    <button type="button" class="h-10 rounded-full px-4 text-label-large text-inverse-primary">Undo</button>
  </li>
</template>

<script type="module">
  import { connectMotion, getMotion } from '@udixio/motion';
  import '@udixio/motion/presets';

  connectMotion();

  const list = document.getElementById('toasts');
  const model = document.getElementById('toast').content.firstElementChild;
  const timers = new Map();

  // The exit plays, then the toast is removed: its neighbours close the gap.
  async function dismiss(toast) {
    clearTimeout(timers.get(toast));
    timers.delete(toast);
    const presence = getMotion(toast, 'presence');
    if ((await presence.setPresent(false)) === 'finished') toast.remove();
  }

  document.getElementById('save').addEventListener('click', () => {
    // Past three, the oldest leaves as the new one enters.
    const shown = [...list.children].filter((each) => getMotion(each, 'presence')?.present);
    if (shown.length >= 3) dismiss(shown[0]);
    const toast = model.cloneNode(true);
    toast.querySelector('button').addEventListener('click', () => dismiss(toast));
    // Inserted: its entry plays.
    list.append(toast);
    timers.set(toast, setTimeout(() => dismiss(toast), 4000));
  });
</script>
