  A feed of cards. Each card rises once, as it comes into the view of the feed.
  Before that it waits in its first frame, out of sight.
-->
<ol
  class="flex h-64 w-full max-w-[22rem] flex-col gap-2 overflow-y-auto rounded-2xl bg-surface-container p-3"
  tabindex="0"
  aria-label="Feed"
>
  <li data-motion="rise" class="rounded-2xl bg-surface-container-high px-4 py-3 text-title-small text-on-surface">Release notes</li>
  <li data-motion="rise" class="rounded-2xl bg-surface-container-high px-4 py-3 text-title-small text-on-surface">Design review</li>
  <li data-motion="rise" class="rounded-2xl bg-surface-container-high px-4 py-3 text-title-small text-on-surface">Build passed</li>

  <li data-motion="rise" class="rounded-2xl bg-surface-container-high px-4 py-3 text-title-small text-on-surface">Invoice sent</li>
</ol>

<script type="module">
  import { connectMotion } from '@udixio/motion';
  import '@udixio/motion/presets';

  // rise: a reveal that plays once, when its card enters the view. connectMotion() binds every card of the page.
  connectMotion();
</script>
