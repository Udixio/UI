<!-- A mini-player that opens into the player. Its attribute changes, and the layout moves it: no call of its own. -->
<div data-motion-scope class="flex w-full max-w-88 flex-col">
  <div
    id="player"
    data-motion="reflow"
    class="flex h-16 flex-row items-center gap-3 rounded-3xl bg-surface-container-high px-3 data-[open]:h-64 data-[open]:flex-col data-[open]:items-start data-[open]:justify-between data-[open]:gap-4 data-[open]:p-5"
  >
    <span class="size-10 shrink-0 rounded-xl bg-tertiary-container"></span>
    <span class="flex min-w-0 flex-1 flex-col">
      <span class="text-title-medium text-on-surface">Night drive</span>
      <span class="text-body-small text-on-surface-variant">Low tide</span>
    </span>
    <button
      type="button"
      id="toggle"
      class="h-8 shrink-0 rounded-full bg-primary px-3 text-label-large text-on-primary"
    >
      Open
    </button>
  </div>
</div>

<script type="module">
  import { connectMotion } from '@udixio/motion';
  import '@udixio/motion/presets';

  connectMotion();

  const player = document.getElementById('player');
  const toggle = document.getElementById('toggle');

  toggle.addEventListener('click', () => {
    // An attribute is observed: the layout moves the player from its old size to its new one.
    const open = player.toggleAttribute('data-open');
    toggle.textContent = open ? 'Close' : 'Open';
  });
</script>
