<!--
  A sequence: the parts of one card play in named steps, with one handle for the whole choreography. The card is on the
  page at load, so its sequence waits for the button.
-->
<div class="flex w-full max-w-72 flex-col items-start gap-4">
  <div id="intro" data-motion="intro-steps" class="flex w-full flex-col gap-2 rounded-3xl bg-primary-container p-5 text-on-primary-container">
    <p data-motion-step="kicker" class="text-label-large">Now playing</p>
    <h3 data-motion-step="title" class="text-title-large">Night Drive</h3>
    <p data-motion-step="body" class="text-body-medium">Lumen · Side B</p>
  </div>
  <button type="button" id="replay" class="h-10 rounded-full bg-primary px-4 text-label-large text-on-primary">Replay</button>
</div>

<script type="module">
  import { connectMotion } from '@udixio/motion';
  import { defineSequence, getSequence } from '@udixio/motion/sequence';
  import '@udixio/motion/presets';

  // The kicker plays first; the title starts one normal step after it, and the artist one normal step after the title.
  defineSequence('intro-steps', {
    verb: 'appear',
    steps: {
      kicker: { keyframes: [{ opacity: 0 }, { opacity: 1 }] },
      title: {
        keyframes: [{ opacity: 0, y: 12 }, { opacity: 1, y: 0 }],
        timing: { duration: 'duration.extraLong2', easing: 'easing.standard' },
        at: '+=normal',
      },
      body: { keyframes: [{ opacity: 0 }, { opacity: 1 }], at: '+=normal' },
    },
  });
  // Binds data-motion="intro-steps" on the root that is already on the page.
  connectMotion();

  const intro = document.getElementById('intro');
  document.getElementById('replay').addEventListener('click', () => getSequence(intro)?.play());
</script>
