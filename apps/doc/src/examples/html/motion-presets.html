<!-- A preset needs no definition: it is named in data-motion. -->
<div id="card" data-motion="fade">Fades in and out</div>
<button type="button" id="toggle" aria-expanded="true" aria-controls="card">Hide</button>
<button type="button" id="save" data-motion="press" data-motion-state="0">Save</button>

<script type="module">
  import { connectMotion } from '@udixio/motion';
  import '@udixio/motion/presets';

  connectMotion();

  const card = document.getElementById('card');
  const toggle = document.getElementById('toggle');
  const save = document.getElementById('save');

  // Hidden: the exit plays, then it goes. Shown: the entry plays.
  toggle.addEventListener('click', () => {
    card.hidden = !card.hidden;
    toggle.setAttribute('aria-expanded', String(!card.hidden));
    toggle.textContent = card.hidden ? 'Show' : 'Hide';
  });

  // An emphasis replays each time data-motion-state changes.
  save.addEventListener('click', () => {
    save.dataset.motionState = String(Number(save.dataset.motionState) + 1);
  });
</script>
