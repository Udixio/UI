<!-- The queue keeps five tracks. Adding three makes them cascade in at the bottom; the oldest leave from the top. -->
<div class="flex w-full max-w-80 flex-col items-start gap-4">
  <button
    type="button"
    id="add"
    class="h-10 rounded-full bg-primary px-4 text-label-large text-on-primary"
  >
    Add three
  </button>
  <p class="text-title-small text-on-surface">Up next</p>
  <ul id="queue" class="relative flex w-full flex-col gap-2">
    <li data-motion="cascade reflow" class="rounded-2xl bg-surface-container-high px-4 py-3 text-body-large text-on-surface">Intro</li>
    <li data-motion="cascade reflow" class="rounded-2xl bg-surface-container-high px-4 py-3 text-body-large text-on-surface">Morning</li>
    <li data-motion="cascade reflow" class="rounded-2xl bg-surface-container-high px-4 py-3 text-body-large text-on-surface">Harbour</li>
    <li data-motion="cascade reflow" class="rounded-2xl bg-surface-container-high px-4 py-3 text-body-large text-on-surface">Afterglow</li>
    <li data-motion="cascade reflow" class="rounded-2xl bg-surface-container-high px-4 py-3 text-body-large text-on-surface">Halfway</li>
  </ul>
</div>

<template id="track">
  <li data-motion="cascade reflow" class="rounded-2xl bg-surface-container-high px-4 py-3 text-body-large text-on-surface"></li>
</template>

<script type="module">
  import { connectMotion } from '@udixio/motion';
  import '@udixio/motion/presets';

  connectMotion();

  const TRACKS = ['Night drive', 'Glass city', 'Low tide', 'Harbour', 'Afterglow', 'Halfway', 'Paper moon'];
  const queue = document.getElementById('queue');
  const model = document.getElementById('track').content.firstElementChild;
  let count = 5;

  document.getElementById('add').addEventListener('click', () => {
    const three = [0, 1, 2].map(() => {
      count += 1;
      const track = model.cloneNode(true);
      track.textContent = TRACKS[count % TRACKS.length];
      return track;
    });
    // Inserted in one task: the three cascade in, in visual order.
    queue.append(...three);
    // Past five, the oldest tracks are hidden: each plays its exit, and the tracks below it close the gap.
    const shown = [...queue.children].filter((track) => !track.hidden);
    shown.slice(0, Math.max(0, shown.length - 5)).forEach((track) => (track.hidden = true));
  });
</script>
