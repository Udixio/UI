<!--
  A queue of tracks: they reorder by drag, or by Space and the arrows. The suggestion is swiped away, and the button brings
  it back.
-->
<div class="flex w-full max-w-88 flex-col items-start gap-4">
  <ul id="queue" class="flex w-full flex-col gap-2">
    <li data-motion="reflow" data-motion-gesture="reorder" class="cursor-grab rounded-2xl bg-surface-container-highest py-2.5 pl-4 pr-4 text-body-large text-on-surface focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-on-surface">Night Drive</li>
    <li data-motion="reflow" data-motion-gesture="reorder" class="cursor-grab rounded-2xl bg-surface-container-highest py-2.5 pl-4 pr-4 text-body-large text-on-surface focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-on-surface">Signal Fire</li>
    <li data-motion="reflow" data-motion-gesture="reorder" class="cursor-grab rounded-2xl bg-surface-container-highest py-2.5 pl-4 pr-4 text-body-large text-on-surface focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-on-surface">Open Road</li>
  </ul>
  <div id="suggestions" class="w-full">
    <div id="suggestion" data-motion-gesture="complete" class="cursor-grab rounded-2xl bg-tertiary-container px-4 py-3 text-title-small text-on-tertiary-container focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-on-surface">Suggested: Lantern</div>
  </div>
  <p class="text-body-medium text-on-surface-variant">Swiped away: <output id="count">0</output></p>
  <button type="button" id="restore" class="h-10 rounded-full bg-primary px-4 text-label-large text-on-primary">Restore the queue</button>
</div>

<script type="module">
  import { connectMotion } from '@udixio/motion';
  import { defineGesture } from '@udixio/motion/gesture';
  import '@udixio/motion/presets';

  // Reorder: a track moves among its siblings, and each step is an event that can be refused.
  defineGesture('reorder', {
    type: 'reorder',
    alternative: 'grab',
  });
  // Swipe: released far or fast enough, the card flies out. Delete does the same on the focused card.
  defineGesture('complete', {
    type: 'swipe',
    alternative: 'action',
  });

  // A clean copy of the card, taken before the runtime binds it, and the order of the tracks.
  const queue = document.getElementById('queue');
  const suggestions = document.getElementById('suggestions');
  const tracks = [...queue.children];
  const suggestion = document.getElementById('suggestion').cloneNode(true);
  connectMotion(); // binds data-motion and data-motion-gesture

  const count = document.getElementById('count');
  let swiped = 0;
  // The swipe bubbles to the suggestions: the count goes up.
  suggestions.addEventListener('motion-swipe', () => {
    count.textContent = String(++swiped);
  });
  // Restore puts the tracks back in their order, and a clean copy of the card.
  document.getElementById('restore').addEventListener('click', () => {
    queue.replaceChildren(...tracks);
    suggestions.replaceChildren(suggestion.cloneNode(true));
    swiped = 0;
    count.textContent = '0';
  });
</script>
