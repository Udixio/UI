<!-- Hide sends its focus to the button first (WCAG 2.4.3). The motion-none class (--udx-motion: none) keeps a state at once. -->
<button type="button" id="hide" aria-expanded="true" aria-controls="card">
  Hide
</button>
<div
  id="card"
  data-motion="slide"
  data-motion-restore-focus="#hide"
>Saved</div>
<div data-motion="slide" class="motion-none">Shown at once</div>

<script type="module">
  import { connectMotion } from '@udixio/motion';
  import '@udixio/motion/presets';

  connectMotion();

  const card = document.getElementById('card');
  const hide = document.getElementById('hide');
  hide.addEventListener('click', () => {
    card.hidden = !card.hidden;
    hide.setAttribute('aria-expanded', String(!card.hidden));
    hide.textContent = card.hidden ? 'Show' : 'Hide';
  });
</script>
