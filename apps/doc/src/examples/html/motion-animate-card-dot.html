<!--
  animateStyle animates the CSS of the card over a timing. createSpring follows the range with the dot, over a spring.
-->
<div id="card" class="flex h-24 w-full max-w-72 items-center justify-center rounded-3xl bg-surface-container-high text-title-medium text-on-surface">Next state</div>
<button type="button" id="next">Next state</button>
<input type="range" id="position" min="0" max="300" value="0" aria-label="Position" />
<span id="dot" class="block size-4 rounded-full bg-primary"></span>

<script type="module">
  import { animateStyle, createSpring } from '@udixio/motion/animate';

  const card = document.getElementById('card');
  const dot = document.getElementById('dot');
  const STATES = [
    { backgroundColor: 'var(--color-primary-container)', borderRadius: '28px', clipPath: 'inset(0% round 28px)' },
    { backgroundColor: 'var(--color-tertiary-container)', borderRadius: '8px', clipPath: 'inset(6% 4% round 8px)' },
  ];
  let state = 0;

  // A single keyframe starts from the current style of the card, so the change goes on from where the card is.
  document.getElementById('next').addEventListener('click', () => {
    state = (state + 1) % STATES.length;
    animateStyle(card, STATES[state], {
      timing: 'spring.default.effects',
    });
  });

  // The dot follows the range over a spring, and lags behind it.
  const offset = createSpring(0, {
    timing: 'spring.default.spatial',
    onUpdate: (value) => {
      dot.style.translate = `${value}px 0`;
    },
  });
  document.getElementById('position').addEventListener('input', (event) => {
    offset.to(Number(event.target.value));
  });
</script>
