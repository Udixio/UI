<!-- A motion is defined once, by name, before the page connects. The card is attached to it with data-motion. -->
<div id="card" data-motion="card-enter">Fades in and rises</div>
<button type="button" id="toggle" aria-expanded="true" aria-controls="card">Hide</button>

<script type="module">
  import { connectMotion, defineMotion } from '@udixio/motion';

  defineMotion('card-enter', {
    verb: 'appear',
    keyframes: [
      { opacity: 0, y: 24 },
      { opacity: 1, y: 0 },
    ],
    timing: 'spring.default.spatial',
  });

  connectMotion();

  const card = document.getElementById('card');
  const toggle = document.getElementById('toggle');

  // Hidden: the exit plays, then the card is hidden. Shown again: the entry plays.
  toggle.addEventListener('click', () => {
    card.hidden = !card.hidden;
    toggle.setAttribute('aria-expanded', String(!card.hidden));
    toggle.textContent = card.hidden ? 'Show' : 'Hide';
  });
</script>
