name: Release Process

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag. Vide = release stable (passe par une PR vers main). beta/next = publication directe, sans PR."
        required: false
        default: ""
        type: choice
        options:
          - ""
          - next
          - beta

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    env:
      TAG: ${{ github.event.inputs.tag }}
    steps:
      - name: Get Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
          run_install: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        run: |
          corepack prepare npm@latest --activate
          npm -v

      - name: Set Git Identity
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Verify every publishable package is ready for provenance
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const roots = ["packages", "packages/icons"];
            const files = roots.flatMap((root) =>
              fs.readdirSync(root, { withFileTypes: true })
                .filter((entry) => entry.isDirectory())
                .map((entry) => path.join(root, entry.name, "package.json"))
                .filter((f) => fs.existsSync(f))
            );
            const problems = [];
            for (const f of files) {
              const pkg = JSON.parse(fs.readFileSync(f, "utf8"));
              if (pkg.private) continue;
              if (pkg.publishConfig?.access !== "public") {
                problems.push(`${f}: missing publishConfig.access: "public"`);
              }
              if (pkg.repository?.url !== "https://github.com/Udixio/UI.git") {
                problems.push(`${f}: repository.url must be "https://github.com/Udixio/UI.git" (sigstore provenance verification matches against it)`);
              }
            }
            if (problems.length > 0) {
              console.error("New or misconfigured packages found:");
              problems.forEach((p) => console.error(`  - ${p}`));
              process.exit(1);
            }
            console.log(`Checked ${files.length} packages, all publishable ones are ready for provenance.`);
          '

      - name: Run package tests
        run: npx nx run-many --target=test --all --parallel=3

      - name: Version packages
        run: |
          if [ -n "$TAG" ]; then
            npx nx release --skip-publish --preid="$TAG" --verbose
          else
            npx nx release --skip-publish --verbose
          fi
        env:
          NPM_CONFIG_PROVENANCE: true
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Install dependencies
        run: pnpm i

      - name: Push version bump to the source branch
        id: release-branch
        run: |
          VERSION=$(node -p "require('./packages/ui-react/package.json').version")
          git push origin "HEAD:refs/heads/${{ github.ref_name }}" --follow-tags
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release branch for the PR (stable only)
        if: env.TAG == ''
        id: release-pr-branch
        run: |
          BRANCH="release/v${{ steps.release-branch.outputs.version }}"
          git branch "$BRANCH"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Publish prerelease directly (beta/next only)
        if: env.TAG != ''
        run: npx nx release publish --tag "$TAG" --verbose
        env:
          NPM_CONFIG_PROVENANCE: true
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Open release PR to main (stable only)
        if: env.TAG == ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.release-pr-branch.outputs.branch }}" \
            --title "Release ${{ steps.release-pr-branch.outputs.branch }}" \
            --body "Automated release PR (triggered from \`${{ github.ref_name }}\`). Merging this publishes to npm as \`latest\` and merges the version bump back into \`develop\`."
